name: sei

x-api-env: &api-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://${DB_API_USER}:${DB_API_PASSWORD}@db:5432/${POSTGRES_DB}
  MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  CORS_ORIGINS: ${CORS_ORIGINS}
  SECRET_KEY: ${SECRET_KEY}
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
  PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL}
  MAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_LEADS_TO: ${MAIL_LEADS_TO}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_API_USER: ${DB_API_USER}
      DB_API_PASSWORD: ${DB_API_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the public and private buckets once MinIO is up.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET_PUBLIC} &&
      mc mb --ignore-existing local/${S3_BUCKET_PRIVATE} &&
      mc anonymous set download local/${S3_BUCKET_PUBLIC} &&
      mc anonymous set none local/${S3_BUCKET_PRIVATE}"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: ../api
      target: dev
    environment: *api-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../api/app:/app/app
      - ../api/alembic:/app/alembic
      - ../api/tests:/app/tests
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx astro dev --host 0.0.0.0 --port 4321"
    environment:
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY}
      API_INTERNAL_URL: http://api:8000
      ASTRO_TELEMETRY_DISABLED: "1"
    volumes:
      - ../web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - web
      - api

volumes:
  db-data:
  minio-data:
  web-node-modules:
