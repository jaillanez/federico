# Production stack. Run from the repo root:
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build
# (or `make deploy` on the server). Variables: infra/.env.prod.example.
name: sei

x-api-common: &api-common
  build:
    context: ../api
    target: prod
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

x-runtime-env: &runtime-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://${DB_API_USER}:${DB_API_PASSWORD}@db:5432/${POSTGRES_DB}
  CORS_ORIGINS: '["https://${DOMAIN}"]'
  PUBLIC_SITE_URL: https://${DOMAIN}
  SECRET_KEY: ${SECRET_KEY}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_PRESIGN_ENDPOINT_URL: ${S3_PRESIGN_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
  BACKUP_BUCKET: ${BACKUP_BUCKET}
  PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL}
  MAIL_BACKEND: smtp
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  MAIL_FROM: ${MAIL_FROM}
  MAIL_LEADS_TO: ${MAIL_LEADS_TO}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
  SESSION_COOKIE_SECURE: "true"
  REBUILD_WEBHOOK_URL: http://web-build:4322/__rebuild
  REBUILD_WEBHOOK_TOKEN: ${REBUILD_WEBHOOK_TOKEN}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_API_USER: ${DB_API_USER}
      DB_API_PASSWORD: ${DB_API_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: migrations and bucket bootstrap with the OWNER user, which the API never sees.
  migrate:
    build:
      context: ../api
      target: prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
      BACKUP_BUCKET: ${BACKUP_BUCKET}
    command: sh -c "alembic upgrade head && python -m app.scripts.init_storage"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-common
    environment:
      <<: *runtime-env
      # Only Caddy may set X-Forwarded-For (client IP used for the lead rate limit).
      FORWARDED_ALLOW_IPS: 172.30.0.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Hourly: rebuild when scheduled articles go live. Daily 03:30 ART: purge old leads + backup.
  scheduler:
    <<: *api-common
    environment:
      <<: *runtime-env
      BACKUP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    command: python -m app.scripts.scheduler
    volumes:
      - ./backup.sh:/app/infra/backup.sh:ro
      - ./restore.sh:/app/infra/restore.sh:ro

  web-build:
    build: ../web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      PUBLIC_SITE_URL: https://${DOMAIN}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY}
      SITE_DIR: /srv/site
      BUILD_SERVER_HOST: 0.0.0.0
      REBUILD_WEBHOOK_TOKEN: ${REBUILD_WEBHOOK_TOKEN}
      BUILD_ON_START: "1"
    volumes:
      - site:/srv/site
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      MEDIA_ORIGIN: ${MEDIA_ORIGIN}
      ANALYTICS_ORIGIN: ${ANALYTICS_ORIGIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./caddy/site.caddy:/etc/caddy/site.caddy:ro
      - ./redirects.caddy:/etc/caddy/redirects.caddy:ro
      - site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      - api
      - web-build

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
  site:
  caddy-data:
  caddy-config:
