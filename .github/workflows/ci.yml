name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sei_owner
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sei_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sei_owner" --health-interval 3s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
      # Commit of that tag; the build fails if the tag ever points elsewhere.
      MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
      TEST_DATABASE_URL: postgresql+asyncpg://sei_owner:ci@localhost:5432/sei_test
      TEST_S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: sei-minio
      S3_SECRET_KEY: sei-minio-secret
      TEST_MAILPIT_URL: http://localhost:8025
      # The GPS-stripping test must run in CI (it is skipped locally without exiftool).
      REQUIRE_EXIFTOOL: "1"
      TEST_SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v5
      # MinIO no longer publishes community images or binaries, so we build the pinned release
      # from source on every run (no cached binary to tamper with) and verify the exact commit.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build MinIO from source
        working-directory: /tmp
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/minio/minio.git minio-src
          cd minio-src
          git checkout --quiet "$MINIO_COMMIT"
          test "$(git rev-parse HEAD)" = "$MINIO_COMMIT"
          test "$(git rev-parse "refs/tags/$MINIO_RELEASE^{commit}")" = "$MINIO_COMMIT"
          CGO_ENABLED=0 go build -trimpath -o ~/minio-bin/minio .
      - name: Start MinIO
        run: |
          MINIO_ROOT_USER=sei-minio MINIO_ROOT_PASSWORD=sei-minio-secret \
            nohup ~/minio-bin/minio server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          cat /tmp/minio.log; exit 1
      - name: Install exiftool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy app tests
      - name: Tests
        run: uv run pytest --cov=app/routers --cov=app/services --cov-fail-under=80

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    # The static build reads projects and articles from the API, so CI runs a real one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sei_owner
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sei
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sei_owner" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://sei_owner:ci@localhost:5432/sei
      ENVIRONMENT: test
      API_INTERNAL_URL: http://localhost:8000
      PUBLIC_SITE_URL: https://servielect.com.ar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run check
      - name: Unit tests (formulas, markdown)
        run: npm test
      - name: Start API with sample data
        working-directory: api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m app.scripts.seed
          nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Build
        run: npm run build
      - name: Check generated pages
        run: |
          test -f dist/obras/ejemplo-tablero-bombeo-finca.html
          test -f dist/articulos/ejemplo-que-es-la-energia-reactiva.html
          test -f dist/og/inicio.png
          ! test -e dist/estilos.html
      # The background API keeps uv's cache locked; stop it so setup-uv can save the cache.
      - name: Stop API
        if: always()
        run: pkill -f "uvicorn app.main:app" || true
