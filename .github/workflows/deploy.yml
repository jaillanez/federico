name: Deploy

# Deploys main to the server after CI passes on it. Needs these repository secrets:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key of a deploy-only user),
#   DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan <host>`, pins the server's key)
# Without them the job is skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "Sin secretos de deploy: se omite."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy over SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          case "$SHA" in *[!0-9a-f]*|"") echo "SHA inválido"; exit 1;; esac
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "/opt/sei/infra/deploy.sh $SHA"
